<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCORD | User Authentication</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* --- Premium CSS Variables (Synced with index.html) --- */
        :root {
            --accent: #f17065;
            --accent-hover: #e05b50;
            --bg-body: #f9fafb;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: rgba(0, 0, 0, 0.08);
            --input-bg: #f3f4f6;
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 40px -5px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: #0f172a;
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px -5px rgba(0, 0, 0, 0.4);
        }

        /* --- Base Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--accent-hover);
        }

        /* --- Premium Navbar --- */
        .premium-nav {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .navbar-brand {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-main) !important;
        }

        body.dark-mode .navbar-toggler-icon {
            filter: invert(1);
        }

        body.dark-mode .navbar-collapse {
            background-color: var(--bg-glass);
            border-radius: 12px;
            padding: 10px;
        }

        /* --- Auth Section & Card --- */
        .auth-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background-color: var(--bg-surface);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .auth-card h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-subtitle {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        /* --- Premium Inputs --- */
        .input-icon-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 14px;
            padding: 14px 18px 14px 45px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-control:focus {
            background-color: var(--bg-surface);
            border-color: var(--accent);
            color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(241, 112, 101, 0.15);
        }

        .form-control:focus + i, 
        .input-icon-wrapper:focus-within i {
            color: var(--accent);
        }

        /* --- Buttons --- */
        .btn-premium {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: 600;
            padding: 14px;
            border-radius: 14px;
            border: none;
            width: 100%;
            font-size: 1.05rem;
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 15px rgba(241, 112, 101, 0.25);
        }

        .btn-premium:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(241, 112, 101, 0.35);
        }

        .toggle-text {
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .toggle-text a {
            font-weight: 600;
        }

        /* --- Alerts --- */
        .alert-message {
            margin-top: 25px;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            animation: slideUpFade 0.4s ease forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #16a34a;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        body.dark-mode .alert-success { color: #4ade80; }
        body.dark-mode .alert-danger { color: #f87171; }

        /* --- Footer --- */
        .premium-footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar navbar-expand-lg premium-nav fixed-top px-3 py-3">
        <div class="container-fluid max-w-7xl">
            <a class="navbar-brand" href="index.html">ACCORD</a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-between" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                </ul>

                <div class="d-flex align-items-center gap-4 justify-content-center mt-3 mt-lg-0">
                    <button id="darkModeToggle" class="btn btn-outline-secondary btn-sm rounded-pill px-4 py-2 fw-semibold d-flex align-items-center gap-2" type="button">
                        <i class="fas fa-moon"></i> Dark
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Auth Section -->
    <main class="auth-wrapper mt-5">
        <div class="auth-card">
            <h2 id="formTitle">Welcome Back</h2>
            <p id="formSubtitle" class="auth-subtitle">Enter your credentials to access your account.</p>
            
            <form id="authForm">
                <div class="input-icon-wrapper">
                    <input type="text" id="username" class="form-control" placeholder="Username" required autocomplete="username">
                    <i class="fas fa-user"></i>
                </div>
                
                <div class="input-icon-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                </div>
                
                <button type="submit" class="btn-premium" id="submitButton">Log In</button>
            </form>
            
            <div class="toggle-text">
                <span id="togglePrefix">Don't have an account? </span>
                <a href="#" id="toggleForm">Create one</a>
            </div>
            
            <div id="message" class="alert-message"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="premium-footer py-4 text-center">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-center gap-4 mb-2">
                <span class="text-muted fw-semibold">ACCORD © 2025</span>
                <a href="#" class="text-muted text-decoration-none">Privacy & Legal</a>
                <a href="#" class="text-muted text-decoration-none">Contact</a>
                <a href="#" class="text-muted text-decoration-none">Help Center</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const authForm = document.getElementById('authForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const submitButton = document.getElementById('submitButton');
            const toggleFormLink = document.getElementById('toggleForm');
            const togglePrefix = document.getElementById('togglePrefix');
            const messageDiv = document.getElementById('message');
            const darkModeToggle = document.getElementById('darkModeToggle');

            let isLoginMode = true;

            // --- Dark Mode Logic (Synced with index.html) ---
            const setDarkMode = (isDark) => {
                document.body.classList.toggle('dark-mode', isDark);
                if (isDark) {
                    darkModeToggle.innerHTML = '<i class="fas fa-sun"></i> Light';
                    darkModeToggle.classList.replace('btn-outline-dark', 'btn-outline-light');
                    // Fallback if it has secondary on load
                    darkModeToggle.classList.replace('btn-outline-secondary', 'btn-outline-light'); 
                } else {
                    darkModeToggle.innerHTML = '<i class="fas fa-moon"></i> Dark';
                    darkModeToggle.classList.replace('btn-outline-light', 'btn-outline-dark');
                    // Fallback
                    darkModeToggle.classList.replace('btn-outline-secondary', 'btn-outline-dark');
                }
                localStorage.setItem('darkMode', isDark);
            };

            const savedDarkMode = localStorage.getItem('darkMode');
            setDarkMode(savedDarkMode === 'true');

            darkModeToggle.addEventListener('click', () => {
                setDarkMode(!document.body.classList.contains('dark-mode'));
            });

            // --- Toggle Login / Register ---
            toggleFormLink.addEventListener('click', (e) => {
                e.preventDefault();
                isLoginMode = !isLoginMode;
                
                if (isLoginMode) {
                    formTitle.textContent = 'Welcome Back';
                    formSubtitle.textContent = 'Enter your credentials to access your account.';
                    submitButton.textContent = 'Log In';
                    togglePrefix.textContent = "Don't have an account? ";
                    toggleFormLink.textContent = 'Create one';
                    passwordInput.setAttribute('autocomplete', 'current-password');
                } else {
                    formTitle.textContent = 'Join ACCORD';
                    formSubtitle.textContent = 'Create an account to start your learning journey.';
                    submitButton.textContent = 'Register';
                    togglePrefix.textContent = "Already have an account? ";
                    toggleFormLink.textContent = 'Log in';
                    passwordInput.setAttribute('autocomplete', 'new-password');
                }
                
                messageDiv.style.display = 'none';
                usernameInput.value = '';
                passwordInput.value = '';
            });

            // --- Form Submission Logic ---
            authForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                messageDiv.style.display = 'block';
                messageDiv.className = 'alert-message'; // Reset classes

                // Validation
                if (username.length < 3) {
                    showError('Username must be at least 3 characters long.');
                    return;
                }
                if (password.length < 6) {
                    showError('Password must be at least 6 characters long.');
                    return;
                }

                if (isLoginMode) {
                    // Login Mode
                    if (username === 'Harshit Patel' && password === '04052006') {
                        showSuccess('Login successful! Redirecting...');
                        setTimeout(() => {
                            window.location.href = '/Teachers/teachers.html';
                        }, 1500);
                    } else {
                        showError('Invalid username or password.');
                    }
                } else {
                    // Register Mode
                    if (username.toLowerCase() === 'harshit patel') {
                        showError('This administrator username cannot be registered.');
                        return;
                    }

                    const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
                    
                    if (registeredUsers[username]) {
                        showError('This username is already taken.');
                        return;
                    }

                    // Save User
                    registeredUsers[username] = password;
                    localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

                    showSuccess('Account created successfully! Redirecting to login...');
                    
                    setTimeout(() => {
                        toggleFormLink.click(); // Programmatically switch back to login
                        usernameInput.value = username; // Pre-fill username for convenience
                    }, 2000);
                }
            });

            // Helper functions for alerts
            function showError(msg) {
                messageDiv.classList.add('alert-danger');
                messageDiv.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i>${msg}`;
            }

            function showSuccess(msg) {
                messageDiv.classList.add('alert-success');
                messageDiv.innerHTML = `<i class="fas fa-check-circle me-2"></i>${msg}`;
            }
        });
    </script>
</body>
</html>
