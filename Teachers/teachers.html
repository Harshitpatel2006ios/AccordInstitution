<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCORD | My Daily Tasks</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* --- Premium CSS Variables (Synced with ACCORD Design System) --- */
        :root {
            --accent: #f17065;
            --accent-hover: #e05b50;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-body: #f9fafb;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: rgba(0, 0, 0, 0.08);
            --input-bg: #f3f4f6;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: #0f172a;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        /* --- Base Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
        }

        /* --- Premium Navbar --- */
        .premium-nav {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .navbar-brand {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-main) !important;
        }

        body.dark-mode .navbar-toggler-icon {
            filter: invert(1);
        }

        body.dark-mode .navbar-collapse {
            background-color: var(--bg-glass);
            border-radius: 12px;
            padding: 10px;
        }

        /* --- Main Layout & Card --- */
        .app-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px; /* Padding top accounts for fixed nav */
        }

        .todo-container {
            background-color: var(--bg-surface);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .todo-container h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* --- Inputs & Segmented Control --- */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 35px;
        }

        .option-buttons {
            display: flex;
            background-color: var(--input-bg);
            border-radius: 12px;
            padding: 5px;
            gap: 5px;
            border: 1px solid var(--border-color);
            transition: background-color 0.4s ease;
        }

        .option-buttons button {
            flex: 1;
            padding: 10px 15px;
            font-size: 0.95rem;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .option-buttons button.active {
            background-color: var(--bg-surface);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
        }

        .form-control-premium {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 1rem;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .form-control-premium:focus {
            outline: none;
            background-color: var(--bg-surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(241, 112, 101, 0.15);
        }

        /* Hide default datetime-local formatting for a cleaner look */
        .form-control-premium[type="datetime-local"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        body.dark-mode .form-control-premium[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .btn-add {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(241, 112, 101, 0.25);
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(241, 112, 101, 0.35);
        }

        /* --- Task List --- */
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .todo-list li {
            background-color: var(--bg-surface);
            padding: 18px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .todo-list li:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: rgba(241, 112, 101, 0.3);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            cursor: pointer;
            overflow: hidden;
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            background-color: transparent;
        }

        .custom-checkbox:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .custom-checkbox:checked::after {
            content: '\f00c'; /* FontAwesome check */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Task Details */
        .task-details {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .task-text {
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        .task-time, .countdown-timer {
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .task-time {
            color: var(--text-muted);
        }

        .countdown-timer {
            color: var(--accent);
            font-weight: 600;
        }

        /* States */
        .todo-list li.completed {
            background-color: var(--input-bg);
            border-color: transparent;
            opacity: 0.7;
        }

        .todo-list li.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .todo-list li.completed .countdown-timer {
            color: var(--text-muted);
        }

        .todo-list li.overdue .countdown-timer {
            color: var(--danger);
        }

        /* Delete Button */
        .btn-delete {
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete:hover {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 15px;
            background-color: var(--input-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
            font-size: 0.95rem;
            margin-top: 20px;
        }

        /* Footer */
        .premium-footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            transition: all 0.4s ease;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Premium Navbar -->
    <header class="navbar navbar-expand-lg premium-nav fixed-top px-3 py-3">
        <div class="container-fluid max-w-7xl">
            <a class="navbar-brand" href="../index.html">ACCORD</a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-between" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="user.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold" href="#" style="color: var(--accent)!important;">Tasks</a></li>
                </ul>

                <div class="d-flex align-items-center gap-4 justify-content-center mt-3 mt-lg-0">
                    <button id="darkModeToggle" class="btn btn-outline-secondary btn-sm rounded-pill px-4 py-2 fw-semibold d-flex align-items-center gap-2" type="button">
                        <i class="fas fa-moon"></i> Dark
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main App -->
    <main class="app-wrapper">
        <div class="todo-container">
            <h1>My Tasks 🚀</h1>
            
            <div class="input-section">
                <div class="option-buttons">
                    <button id="addTimedTaskBtn" class="active">Timed Task</button>
                    <button id="addTaskOnlyBtn">Standard Task</button>
                </div>
                
                <input type="text" id="taskInput" class="form-control-premium" placeholder="What needs to be done?">
                <input type="datetime-local" id="deadlineInput" class="form-control-premium">
                
                <button id="finalAddButton" class="btn-add" onclick="handleAddTask()">Add Timed Task</button>
            </div>
            
            <ul id="taskList" class="todo-list"></ul>
            <p id="emptyMessage" class="empty-message" style="display: none;">
                <i class="fas fa-clipboard-list mb-2 fs-3 d-block"></i>
                No tasks yet! Time to conquer your day. 😊
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="premium-footer py-4 text-center mt-5">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-center gap-4">
                <span class="text-muted fw-semibold">ACCORD © 2025</span>
                <a href="#" class="text-muted text-decoration-none">Privacy & Legal</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Dark Mode Logic (Synced with ACCORD ecosystem) ---
            const darkModeToggle = document.getElementById('darkModeToggle');
            const setDarkMode = (isDark) => {
                document.body.classList.toggle('dark-mode', isDark);
                if (isDark) {
                    darkModeToggle.innerHTML = '<i class="fas fa-sun"></i> Light';
                    darkModeToggle.classList.replace('btn-outline-dark', 'btn-outline-light');
                    darkModeToggle.classList.replace('btn-outline-secondary', 'btn-outline-light');
                } else {
                    darkModeToggle.innerHTML = '<i class="fas fa-moon"></i> Dark';
                    darkModeToggle.classList.replace('btn-outline-light', 'btn-outline-dark');
                    darkModeToggle.classList.replace('btn-outline-secondary', 'btn-outline-dark');
                }
                localStorage.setItem('darkMode', isDark);
            };

            const savedDarkMode = localStorage.getItem('darkMode');
            setDarkMode(savedDarkMode === 'true');

            darkModeToggle.addEventListener('click', () => {
                setDarkMode(!document.body.classList.contains('dark-mode'));
            });

            // --- Task App Logic ---
            const taskInput = document.getElementById('taskInput');
            const deadlineInput = document.getElementById('deadlineInput');
            const taskList = document.getElementById('taskList');
            const emptyMessage = document.getElementById('emptyMessage');
            const addTimedTaskBtn = document.getElementById('addTimedTaskBtn');
            const addTaskOnlyBtn = document.getElementById('addTaskOnlyBtn');
            const finalAddButton = document.getElementById('finalAddButton');

            let isTimedTaskMode = true;

            function getISTDateTimeString(date = new Date()) {
                const options = {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hour12: false,
                    timeZone: 'Asia/Kolkata'
                };
                const parts = new Intl.DateTimeFormat('en-US', options).formatToParts(date);
                const getPart = (type) => parts.find(p => p.type === type).value;
                return `${getPart('year')}-${getPart('month')}-${getPart('day')}T${getPart('hour')}:${getPart('minute')}`;
            }

            function setDeadlineInputToNow() {
                deadlineInput.value = getISTDateTimeString();
            }

            // Mode Selection
            addTimedTaskBtn.addEventListener('click', () => {
                isTimedTaskMode = true;
                deadlineInput.style.display = 'block';
                setDeadlineInputToNow();
                addTimedTaskBtn.classList.add('active');
                addTaskOnlyBtn.classList.remove('active');
                finalAddButton.textContent = 'Add Timed Task';
            });

            addTaskOnlyBtn.addEventListener('click', () => {
                isTimedTaskMode = false;
                deadlineInput.style.display = 'none';
                deadlineInput.value = '';
                addTaskOnlyBtn.classList.add('active');
                addTimedTaskBtn.classList.remove('active');
                finalAddButton.textContent = 'Add Task';
            });

            // Enter key support
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddTask();
            });

            window.handleAddTask = function() {
                const taskText = taskInput.value.trim();
                let deadline = '';

                if (taskText === '') {
                    alert('Please enter a task!');
                    return;
                }

                if (isTimedTaskMode) {
                    deadline = deadlineInput.value;
                    if (deadline === '') {
                        alert('Please select a deadline time!');
                        return;
                    }
                    if (new Date(deadline).getTime() < new Date(getISTDateTimeString()).getTime()) {
                        alert('Deadline time cannot be in the past! Please select a future time.');
                        return;
                    }
                }

                createTaskElement(taskText, false, deadline);
                taskInput.value = '';
                if(isTimedTaskMode) setDeadlineInputToNow(); 
                saveTasks();
                updateEmptyMessage();
            }

            function createTaskElement(taskText, isCompleted, deadline = '') {
                const listItem = document.createElement('li');
                if (isCompleted) listItem.classList.add('completed');
                listItem.dataset.originalDeadline = deadline;

                const taskContentDiv = document.createElement('div');
                taskContentDiv.classList.add('task-content');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'custom-checkbox';
                checkbox.checked = isCompleted;
                
                checkbox.addEventListener('change', function() {
                    listItem.classList.toggle('completed');
                    saveTasks();
                    if (deadline) {
                        const timerSpan = listItem.querySelector('.countdown-timer');
                        if (listItem.classList.contains('completed')) {
                            clearInterval(listItem.timerInterval);
                            timerSpan.textContent = 'Completed!';
                            listItem.classList.remove('overdue');
                        } else {
                            const deadlineTime = new Date(deadline).getTime();
                            if (deadlineTime > new Date(getISTDateTimeString()).getTime()) {
                                updateCountdownDisplay(listItem, deadlineTime, timerSpan);
                                listItem.timerInterval = setInterval(() => {
                                    updateCountdownDisplay(listItem, deadlineTime, timerSpan);
                                }, 1000);
                            } else {
                                timerSpan.textContent = 'Overdue!';
                                listItem.classList.add('overdue');
                            }
                        }
                    }
                });

                // Toggle checkbox when clicking the task content area
                taskContentDiv.addEventListener('click', (e) => {
                    if(e.target !== checkbox) {
                        checkbox.checked = !checkbox.checked;
                        checkbox.dispatchEvent(new Event('change'));
                    }
                });

                const taskDetailsDiv = document.createElement('div');
                taskDetailsDiv.classList.add('task-details');

                const taskSpan = document.createElement('span');
                taskSpan.classList.add('task-text');
                taskSpan.textContent = taskText;
                taskDetailsDiv.appendChild(taskSpan);

                let timerSpan = null;
                if (deadline) {
                    const deadlineDate = new Date(deadline);
                    const formattedTime = deadlineDate.toLocaleString('en-US', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const timeInfo = document.createElement('div');
                    timeInfo.classList.add('task-time');
                    timeInfo.textContent = `Due: ${formattedTime}`;
                    taskDetailsDiv.appendChild(timeInfo);

                    timerSpan = document.createElement('div');
                    timerSpan.classList.add('countdown-timer');
                    taskDetailsDiv.appendChild(timerSpan);

                    if (!isCompleted) {
                        if (deadlineDate.getTime() > new Date(getISTDateTimeString()).getTime()) {
                            updateCountdownDisplay(listItem, deadlineDate.getTime(), timerSpan);
                            listItem.timerInterval = setInterval(() => {
                                updateCountdownDisplay(listItem, deadlineDate.getTime(), timerSpan);
                            }, 1000);
                        } else {
                            timerSpan.textContent = 'Overdue!';
                            listItem.classList.add('overdue');
                        }
                    } else {
                        timerSpan.textContent = 'Completed!';
                    }
                }

                taskContentDiv.appendChild(checkbox);
                taskContentDiv.appendChild(taskDetailsDiv);
                listItem.appendChild(taskContentDiv);

                // Delete Button with FontAwesome Icon
                const deleteButton = document.createElement('button');
                deleteButton.className = 'btn-delete';
                deleteButton.innerHTML = '<i class="fas fa-trash"></i>';
                deleteButton.addEventListener('click', function(e) {
                    e.stopPropagation(); // Prevent triggering the row click
                    if (listItem.timerInterval) clearInterval(listItem.timerInterval);
                    
                    // Add smooth fade out animation before removal
                    listItem.style.opacity = '0';
                    listItem.style.transform = 'translateY(10px)';
                    setTimeout(() => {
                        taskList.removeChild(listItem);
                        saveTasks();
                        updateEmptyMessage();
                    }, 300);
                });

                listItem.appendChild(deleteButton);
                taskList.appendChild(listItem);
            }

            function updateCountdownDisplay(listItem, deadlineTime, timerSpan) {
                const now = new Date(getISTDateTimeString()).getTime();
                const distance = deadlineTime - now;

                if (listItem.classList.contains('completed')) {
                    timerSpan.textContent = 'Completed!';
                    listItem.classList.remove('overdue');
                    clearInterval(listItem.timerInterval);
                    return;
                }

                if (distance < 0) {
                    timerSpan.textContent = 'Overdue!';
                    listItem.classList.add('overdue');
                    clearInterval(listItem.timerInterval);
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                let timeLeftStr = '';
                if (days > 0) timeLeftStr += `${days}d `;
                if (hours > 0 || days > 0) timeLeftStr += `${hours}h `;
                timeLeftStr += `${minutes}m ${seconds}s`;

                timerSpan.textContent = `Time left: ${timeLeftStr}`;
            }

            function saveTasks() {
                const tasks = [];
                taskList.querySelectorAll('li').forEach(item => {
                    tasks.push({
                        text: item.querySelector('.task-text').textContent,
                        completed: item.classList.contains('completed'),
                        deadline: item.dataset.originalDeadline || ''
                    });
                });
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            function loadTasks() {
                const tasks = JSON.parse(localStorage.getItem('tasks'));
                if (tasks) {
                    tasks.forEach(task => {
                        createTaskElement(task.text, task.completed, task.deadline || '');
                    });
                }
                updateEmptyMessage();
            }

            function updateEmptyMessage() {
                emptyMessage.style.display = taskList.children.length === 0 ? 'block' : 'none';
            }

            // Initialize
            loadTasks();
            setDeadlineInputToNow();
        });
    </script>
</body>
</html>
